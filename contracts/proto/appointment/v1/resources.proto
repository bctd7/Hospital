syntax = "proto3";

package hospital.appointment.v1;

option go_package = "hospital/contracts/gen/appointment/v1;appointmentv1";

// 房间、房间可执行项目以及房间/项目周窗口。
message CreateRoomRequest {
  string department_id = 1;
  string campus_id = 2;
  string building = 3;
  int32 floor_number = 4;
  string room_number = 5;
  string operation_id = 6;
  string request_id = 7;
}

message GetRoomRequest {
  string room_id = 1;
  string request_id = 2;
}

message ListRoomsRequest {
  string department_id = 1;
  int64 page = 2;
  int64 page_size = 3;
  string request_id = 4;
}

message ListRoomsResponse {
  repeated Room rooms = 1;
  int64 page = 2;
  int64 page_size = 3;
  int64 total = 4;
}

message UpdateRoomRequest {
  string room_id = 1;
  string campus_id = 2;
  string building = 3;
  int32 floor_number = 4;
  string room_number = 5;
  int64 expected_version = 6;
  string operation_id = 7;
  string request_id = 8;
}

message RetireRoomRequest {
  string room_id = 1;
  int64 expected_version = 2;
  string operation_id = 3;
  string request_id = 4;
}

message ChangeResourceStatusRequest {
  string resource_id = 1;
  int64 expected_version = 2;
  string operation_id = 3;
  string request_id = 4;
}

message Room {
  string room_id = 1;
  string department_id = 2;
  string campus_id = 3;
  string building = 4;
  int32 floor_number = 5;
  string room_number = 6;
  string display_name = 7;
  int64 version = 8;
  string created_at = 9;
  string updated_at = 10;
}

message AddRoomExaminationItemRequest {
  string room_id = 1;
  string item_id = 2;
  string operation_id = 3;
  string request_id = 4;
}

message ListRoomExaminationItemsRequest {
  string room_id = 1;
  string status = 2;
  int64 page = 3;
  int64 page_size = 4;
  string request_id = 5;
}

message ListAvailableRoomsByExaminationItemRequest {
  string item_id = 1;
  bool active_only = 2;
  string request_id = 3;
}

message ListRoomExaminationItemsResponse {
  repeated RoomExaminationItem relations = 1;
  int64 page = 2;
  int64 page_size = 3;
  int64 total = 4;
}

message RoomExaminationItem {
  string relation_id = 1;
  string room_id = 2;
  string item_id = 3;
  string room_display_name = 4;
  string item_name = 5;
  string status = 6;
  int64 version = 7;
  string created_at = 8;
  string updated_at = 9;
  string campus_id = 10;
  string building = 11;
  int32 floor_number = 12;
  string room_number = 13;
}

message SetRoomWeeklyWindowRequest {
  string window_id = 1;
  string room_id = 2;
  int32 weekday = 3;
  string session = 4;
  string open_time = 5;
  string close_time = 6;
  int64 active_capacity = 7;
  int64 expected_version = 8;
  string operation_id = 9;
  string request_id = 10;
}

message SetItemWeeklyWindowRequest {
  string window_id = 1;
  string item_id = 2;
  int32 weekday = 3;
  string session = 4;
  string start_time = 5;
  string booking_cutoff_time = 6;
  string end_time = 7;
  int64 expected_version = 8;
  string operation_id = 9;
  string request_id = 10;
}

message ListWeeklyWindowsRequest {
  string resource_id = 1;
  bool active_only = 2;
  string request_id = 3;
}

message ListRoomWeeklyWindowsResponse {
  repeated RoomWeeklyWindow windows = 1;
}

message ListItemWeeklyWindowsResponse {
  repeated ItemWeeklyWindow windows = 1;
}

message RoomWeeklyWindow {
  string window_id = 1;
  string room_id = 2;
  int32 weekday = 3;
  string session = 4;
  string open_time = 5;
  string close_time = 6;
  int64 active_capacity = 7;
  string status = 8;
  int64 version = 9;
  string created_at = 10;
  string updated_at = 11;
}

message ItemWeeklyWindow {
  string window_id = 1;
  string item_id = 2;
  int32 weekday = 3;
  string session = 4;
  string start_time = 5;
  string booking_cutoff_time = 6;
  string end_time = 7;
  string status = 8;
  int64 version = 9;
  string created_at = 10;
  string updated_at = 11;
}
