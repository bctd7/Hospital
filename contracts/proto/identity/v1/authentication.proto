syntax = "proto3";

package hospital.identity.v1;

option go_package = "hospital/contracts/gen/identity/v1;identityv1";

// 手机号认证、访问令牌与刷新会话。
message SendPhoneLoginCodeRequest {
  string phone = 1;
  string request_id = 2;
}

message SendPhoneLoginCodeResponse {
  bool accepted = 1;
  int64 retry_after_seconds = 2;
}

message PhoneLoginRequest {
  string phone = 1;
  string verification_code = 2;
  string request_id = 3;
}

message PhoneBinding {
  string phone_masked = 1;
  string verification_status = 2;
  string verification_source = 3;
}

message RefreshAccessTokenRequest {
  string refresh_token = 1;
  string request_id = 2;
}

message RevokeRefreshTokenRequest {
  string refresh_token = 1;
  string request_id = 2;
}

message RevokeRefreshTokenResponse {
  bool revoked = 1;
}

message TokenPair {
  string access_token = 1;
  string refresh_token = 2;
  int64 access_expires_in_seconds = 3;
  int64 refresh_expires_in_seconds = 4;
}
