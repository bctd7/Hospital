Name: guidance-rpc
ListenOn: 0.0.0.0:8082
Timeout: 15000
Mode: production
Environment: production
Log:
  ServiceName: guidance-rpc
  Mode: console
  Encoding: json
  Level: info
MySQL:
  DataSource: ${GUIDANCE_MYSQL_DSN}
AuthorizationRedis:
  Addr: ${REDIS_HOST}:${REDIS_PORT}
  Password: ${REDIS_PASSWORD}
  DB: 0
  VersionPrefix: "identity:authorization-version:"
Token:
  Issuer: hospital-identity
  Audience: hospital-services
  AccessPublicKeyBase64: ${IDENTITY_ACCESS_PUBLIC_KEY_BASE64}
  AccessTTLSeconds: 900
AppointmentRPC:
  Endpoints:
    - appointment-rpc:8081
  NonBlock: true
AMap:
  PlaceSearchEndpoint: https://restapi.amap.com/v5/place/text
  GeocodeEndpoint: https://restapi.amap.com/v3/geocode/geo
  WalkingEndpoint: https://restapi.amap.com/v3/direction/walking
  DrivingEndpoint: https://restapi.amap.com/v3/direction/driving
  TransitEndpoint: https://restapi.amap.com/v3/direction/transit/integrated
  WebServiceKey: ${AMAP_WEB_SERVICE_KEY}
  TimeoutMilliseconds: 5000
LLM:
  Endpoint: ${GUIDANCE_LLM_ENDPOINT}
  APIKey: ${GUIDANCE_LLM_API_KEY}
  Model: ${GUIDANCE_LLM_MODEL}
  TimeoutMilliseconds: 10000
