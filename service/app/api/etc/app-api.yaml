Name: app-api
Environment: local
Host: 0.0.0.0
Port: 8888

Log:
  ServiceName: app-api
  Mode: console
  Encoding: json
  Level: info

Middlewares:
  Trace: true
  Log: false
  Recover: true
  Timeout: true
  Metrics: true
  MaxBytes: true

IdentityRPC:
  Endpoints:
    - 127.0.0.1:8080
  NonBlock: true

AuthorizationRedis:
  Addr: ${REDIS_HOST}:${REDIS_PORT}
  Password: ${REDIS_PASSWORD}
  DB: 0
  Prefix: "identity:authorization-version:"

Token:
  Issuer: hospital-identity
  Audience: hospital-services
  AccessPublicKeyBase64: ${IDENTITY_ACCESS_PUBLIC_KEY_BASE64}
  AccessTTLSeconds: 900
