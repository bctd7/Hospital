Name: identity-rpc
ListenOn: 0.0.0.0:8080
Mode: dev
Environment: "${APP_ENV}"
Log:
  ServiceName: identity-rpc
  Mode: console
  Encoding: json
  Level: info
Middlewares:
  StatConf:
    # Authentication requests carry phone numbers, one-time codes, or refresh tokens.
    # Keep RPC timing metrics while preventing request bodies from entering logs.
    IgnoreContentMethods:
      - /hospital.identity.v1.IdentityService/SendPhoneLoginCode
      - /hospital.identity.v1.IdentityService/PhoneLogin
      - /hospital.identity.v1.IdentityService/SearchAdminAccountByPhone
      - /hospital.identity.v1.IdentityService/RefreshAccessToken
      - /hospital.identity.v1.IdentityService/RevokeRefreshToken
MySQL:
  DataSource: ${IDENTITY_MYSQL_DSN}
SessionRedis:
  Addr: ${REDIS_HOST}:${REDIS_PORT}
  Password: ${REDIS_PASSWORD}
  DB: 0
  Prefix: "identity:refresh:"
  AuthorizationVersionPrefix: "identity:authorization-version:"
Kafka:
  Enabled: ${IDENTITY_KAFKA_ENABLED}
  Brokers: "${KAFKA_BROKERS}"
  ClientID: identity-rpc
  AuthorizationChangedTopic: identity.authorization.changed.v1
  AuthorizationVersionConsumerGroup: identity-authorization-version-consumer-v1
  BatchSize: 100
Token:
  Issuer: hospital-identity
  Audience: hospital-services
  AccessPrivateKeyBase64: ${IDENTITY_ACCESS_PRIVATE_KEY_BASE64}
  AccessPublicKeyBase64: ${IDENTITY_ACCESS_PUBLIC_KEY_BASE64}
  AccessTTLSeconds: 900
  RefreshTTLSeconds: 2592000
PhoneLogin:
  # disabled | aliyun | local。local 仅允许 APP_ENV=local/test。
  Verifier: "${SMS_PROVIDER}"
  LocalCode: "${LOCAL_SMS_CODE}"
  AccessKeyID: ${ALIBABA_CLOUD_ACCESS_KEY_ID}
  AccessKeySecret: ${ALIBABA_CLOUD_ACCESS_KEY_SECRET}
  RegionID: cn-shanghai
  Endpoint: dypnsapi.aliyuncs.com
  SignName: ${ALIYUN_PNVS_SIGN_NAME}
  TemplateCode: "${ALIYUN_PNVS_TEMPLATE_CODE}"
  SchemeName: ${ALIYUN_PNVS_SCHEME_NAME}
  ValidSeconds: 300
  IntervalSeconds: 60
  CodeLength: 6
PhoneLookupKeyBase64: ${IDENTITY_PHONE_LOOKUP_KEY_BASE64}
